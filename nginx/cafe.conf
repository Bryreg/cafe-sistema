# ─────────────────────────────────────────────────────────────────────────────
# nginx/cafe.conf — reverse proxy para producción y sandbox
# Copiar a /etc/nginx/sites-available/cafe en el VPS
# Luego: ln -s /etc/nginx/sites-available/cafe /etc/nginx/sites-enabled/cafe
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstream containers (Docker internal network) ────────────────────────────

upstream cafe_prod {
    server cafe_prod:8000;
    keepalive 16;
}

upstream cafe_sandbox {
    server cafe_sandbox:8000;
    keepalive 16;
}

# ── PRODUCCIÓN: app.tudominio.com ────────────────────────────────────────────
server {
    listen 80;
    server_name app.tudominio.com;

    # Redirige a HTTPS (certbot lo activa automáticamente)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.tudominio.com;

    # Certificados SSL (certbot los genera con: certbot --nginx -d app.tudominio.com)
    ssl_certificate     /etc/letsencrypt/live/app.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.tudominio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;   # Para uploads de fotos de facturas

    location / {
        proxy_pass         http://cafe_prod;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Zero-downtime: si el upstream no responde, espera antes de error
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 10s;
    }
}

# ── SANDBOX: sandbox.tudominio.com ───────────────────────────────────────────
server {
    listen 80;
    server_name sandbox.tudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sandbox.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/sandbox.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandbox.tudominio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Acceso restringido por IP (solo tú y el equipo de desarrollo)
    # Descomenta y ajusta cuando tengas la IP fija:
    # allow 190.x.x.x;   # tu IP
    # deny all;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://cafe_sandbox;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
